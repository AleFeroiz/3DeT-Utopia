<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3DeT One Piece — Fichas</title>
  <link rel="stylesheet" href="style/global.css">
  <link rel="stylesheet" href="style/toast.css">
  <link rel="stylesheet" href="style/index.css">
</head>
<body>
<div class="container index-container">
  <header class="index-header">
    <div>
      <h1>⚓ 3DeT One Piece</h1>
      <p class="subtitulo">Gerencie suas fichas de personagem</p>
    </div>
    <div class="login-header" id="loginArea">
      <span id="userInfoIndex" class="user-info-header"></span>
      <button id="btnLoginIndex"  onclick="fazerLogin()"  class="btn btn-login-header">🔑 Login Google</button>
      <button id="btnLogoutIndex" onclick="fazerLogout()" class="btn btn-logout-header" style="display:none">Sair</button>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn btn-criar" id="btnNova">+ Nova Ficha</button>
    <button class="btn btn-pasta" id="btnNovaPasta">📁 Nova Pasta</button>
  </div>

  <div id="areaSemPasta" class="drop-zone"></div>
  <div id="listaPastas"></div>
</div>

<!-- Modal criar/renomear pasta -->
<div id="modalPasta" class="modal-pasta hidden">
  <div class="modal-pasta-content">
    <h2 id="modalPastaTitulo">📁 Nova Pasta</h2>
    <input id="inputNomePasta" placeholder="Nome da pasta..." maxlength="40">
    <div class="modal-pasta-btns">
      <button id="btnConfirmarPasta">Criar</button>
      <button onclick="fecharModalPasta()">Cancelar</button>
    </div>
  </div>
</div>

<script type="module" src="js/index.js"></script>
</body>
</html>
