<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 Livro de Regras — A Utopia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f11;--bg2:#16161a;--bg3:#1e1e24;
  --border:#2a2a35;--border2:#3a3a48;
  --text:#e2e1ea;--text2:#9b9aaa;--text3:#6b6a7a;
  --accent:#c8a96e;--accent2:#e8c98e;--accent-dim:rgba(200,169,110,.12);
  --red:#e05c5c;--green:#5cb87a;--blue:#5b9bd5;--yellow:#d4ac56;--purple:#9b7ed4;
  --sidebar-w:280px;--header-h:56px;--radius:6px;
  --font-body:'DM Sans',sans-serif;--font-serif:'Crimson Pro',Georgia,serif;--font-mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.7;min-height:100vh}

/* TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--header-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.5rem;gap:1rem;z-index:100}
.topbar-logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--text)}
.logo-icon{width:32px;height:32px;background:var(--accent-dim);border:1px solid var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px}
.topbar-title{font-family:var(--font-serif);font-size:1.1rem;font-weight:600;color:var(--accent2);letter-spacing:.02em}
.topbar-sub{font-size:.75rem;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
.topbar-back{margin-left:auto;display:flex;align-items:center;gap:.4rem;color:var(--text3);text-decoration:none;font-size:.82rem;padding:6px 12px;border:1px solid var(--border);border-radius:var(--radius);transition:all .15s}
.topbar-back:hover{color:var(--text);border-color:var(--border2);background:var(--bg3)}
.topbar-search{display:flex;align-items:center;gap:.5rem;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;width:220px}
.topbar-search input{background:none;border:none;outline:none;color:var(--text);font-family:var(--font-body);font-size:.82rem;width:100%}
.topbar-search input::placeholder{color:var(--text3)}
.search-icon{color:var(--text3);font-size:.9rem}
.sidebar-toggle{display:none;background:none;border:1px solid var(--border);color:var(--text2);border-radius:var(--radius);padding:6px 10px;cursor:pointer;font-size:1rem}

/* LAYOUT */
.layout{display:flex;padding-top:var(--header-h);min-height:100vh}

/* SIDEBAR */
.sidebar{position:fixed;top:var(--header-h);left:0;width:var(--sidebar-w);height:calc(100vh - var(--header-h));background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;z-index:50;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.sidebar-header{padding:1rem 1rem .75rem;border-bottom:1px solid var(--border)}
.sidebar-label{font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.nav-link{display:flex;align-items:center;gap:.5rem;padding:7px 1rem;text-decoration:none;color:var(--text2);font-size:.85rem;transition:all .12s;border-left:2px solid transparent;line-height:1.3;cursor:pointer}
.nav-link:hover{color:var(--text);background:var(--bg3);border-left-color:var(--border2)}
.nav-link.active{color:var(--accent2);background:var(--accent-dim);border-left-color:var(--accent)}
.nav-num{font-family:var(--font-mono);font-size:.7rem;color:var(--text3);min-width:28px;text-align:right}
.nav-link.active .nav-num{color:var(--accent)}
.nav-emoji{font-size:.9rem;min-width:20px;text-align:center}
.nav-name{flex:1;line-height:1.3}
.nav-sub .nav-name{color:var(--text3)}
.nav-sub:hover .nav-name{color:var(--text2)}

/* LOADING */
.loading-state{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:4rem;color:var(--text3)}
.loading-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* MAIN */
.main{margin-left:var(--sidebar-w);flex:1;padding:2.5rem 3rem 4rem;max-width:860px}

/* SECTIONS */
.content-section{margin-bottom:0;padding-bottom:3rem;border-bottom:1px solid var(--border)}
.content-section:last-child{border-bottom:none}
.section-header{display:flex;align-items:center;gap:.8rem;padding:2.5rem 0 1.2rem;border-bottom:2px solid var(--border);margin-bottom:1.5rem}
.section-header.sub-header{padding:2rem 0 1rem;border-bottom:1px solid var(--border)}
.section-num{font-family:var(--font-mono);font-size:.75rem;color:var(--accent);background:var(--accent-dim);border:1px solid rgba(200,169,110,.3);padding:2px 8px;border-radius:4px;letter-spacing:.05em}
.section-emoji{font-size:1.5rem;line-height:1}
.sub-header .section-emoji{font-size:1.2rem}
.section-header h2{font-family:var(--font-serif);font-size:1.8rem;font-weight:600;color:var(--text);letter-spacing:-.01em}
.sub-header h2{font-size:1.4rem;color:var(--text2)}

/* TYPOGRAPHY */
.section-body p{color:var(--text2);margin-bottom:.75rem;font-size:.93rem;line-height:1.8}
.section-body h1,.section-body h2,.section-body h3{font-family:var(--font-serif);color:var(--text);margin:1.8rem 0 .6rem;line-height:1.3}
.section-body h1{font-size:1.5rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}
.section-body h2{font-size:1.25rem}
.section-body h3{font-size:1.05rem;color:var(--accent2)}
.section-body h4{font-size:.95rem;color:var(--accent);font-family:var(--font-body);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:1.2rem 0 .4rem}
.section-body h5{font-size:.88rem;font-weight:600;color:var(--text2);margin:1rem 0 .3rem}
.section-body h6{font-size:.82rem;font-weight:600;color:var(--text3);margin:.8rem 0 .3rem}
.section-body strong{color:var(--text);font-weight:600}
.section-body em{color:var(--text2);font-style:italic}
.section-body code{font-family:var(--font-mono);font-size:.82rem;background:var(--bg3);border:1px solid var(--border);padding:1px 6px;border-radius:3px;color:var(--accent2)}
.section-body hr{border:none;border-top:1px solid var(--border);margin:1.5rem 0}
.section-body ul,.section-body ol{padding-left:1.4rem;margin-bottom:.75rem}
.section-body li{color:var(--text2);font-size:.93rem;margin-bottom:.3rem;line-height:1.7}
.section-body blockquote{border-left:3px solid var(--accent);padding:.6rem 1rem;margin:.75rem 0;background:var(--accent-dim);border-radius:0 var(--radius) var(--radius) 0}
.section-body blockquote p,.section-body blockquote{color:var(--accent2);font-style:italic;font-size:.9rem}

/* CALLOUTS */
.callout{border-radius:var(--radius);padding:.8rem 1rem;margin:.8rem 0;font-size:.88rem;border:1px solid}
.callout-title{font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
.callout-body{color:inherit;line-height:1.6}
.callout-body p{color:inherit;font-size:.88rem;margin-bottom:.4rem}
.callout-body ul,.callout-body ol{padding-left:1.2rem}
.callout-body li{color:inherit;font-size:.88rem;margin-bottom:.2rem}
.callout-body strong{color:inherit}
.callout-info{background:rgba(91,155,213,.08);border-color:rgba(91,155,213,.3);color:#8ab8e0}.callout-info .callout-title{color:#5b9bd5}
.callout-warning{background:rgba(212,172,86,.08);border-color:rgba(212,172,86,.3);color:#c9a355}.callout-warning .callout-title{color:#d4ac56}
.callout-danger{background:rgba(224,92,92,.08);border-color:rgba(224,92,92,.3);color:#cc7070}.callout-danger .callout-title{color:#e05c5c}
.callout-success{background:rgba(92,184,122,.08);border-color:rgba(92,184,122,.3);color:#6dbf88}.callout-success .callout-title{color:#5cb87a}
.wiki-img-wrap{display:flex;justify-content:center;margin:2rem 0}
.wiki-img{max-width:160px;height:auto;filter:drop-shadow(0 0 14px rgba(255,255,255,.2));transition:transform .2s,filter .2s}
.wiki-img:hover{transform:scale(1.05);filter:drop-shadow(0 0 22px rgba(255,255,255,.35))}
.callout-note{background:rgba(155,126,212,.08);border-color:rgba(155,126,212,.3);color:#b09ad8}.callout-note .callout-title{color:#9b7ed4}
.callout-tip{background:rgba(92,184,122,.06);border-color:rgba(92,184,122,.25);color:#70b088}.callout-tip .callout-title{color:#5cb87a}
.callout-abstract{background:rgba(91,155,213,.06);border-color:rgba(91,155,213,.2);color:#7aaed4}.callout-abstract .callout-title{color:#5b9bd5}
.callout-quote{background:rgba(200,169,110,.06);border-color:rgba(200,169,110,.2);color:#b89f6e}.callout-quote .callout-title{color:var(--accent)}
.callout-caution{background:rgba(224,92,92,.08);border-color:rgba(224,92,92,.3);color:#cc7070}.callout-caution .callout-title{color:#e05c5c}
.callout-important{background:rgba(212,172,86,.08);border-color:rgba(212,172,86,.3);color:#c9a355}.callout-important .callout-title{color:#d4ac56}

/* TABLES */
.table-wrap{overflow-x:auto;margin:.75rem 0;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead{background:var(--bg3);border-bottom:2px solid var(--border2)}
th{padding:10px 14px;text-align:left;font-weight:600;color:var(--accent2);font-family:var(--font-body);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:8px 14px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}

/* SEARCH */
mark{background:rgba(200,169,110,.3);color:var(--accent2);border-radius:2px;padding:0 2px}
.search-results{position:fixed;top:var(--header-h);left:var(--sidebar-w);right:0;background:var(--bg2);border-bottom:1px solid var(--border);max-height:300px;overflow-y:auto;z-index:200;display:none}
.search-result-item{padding:10px 1.5rem;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.search-result-item:hover{background:var(--bg3)}
.search-result-title{font-weight:600;font-size:.85rem;color:var(--text);display:flex;align-items:center;gap:.4rem}
.search-result-preview{font-size:.78rem;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* SCROLL TOP */
.scroll-top{position:fixed;bottom:2rem;right:2rem;width:38px;height:38px;background:var(--bg3);border:1px solid var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .2s;color:var(--text2);font-size:.9rem;text-decoration:none;z-index:50}
.scroll-top.visible{opacity:1;pointer-events:all}
.scroll-top:hover{background:var(--bg2);color:var(--text);border-color:var(--accent)}

/* RESPONSIVE */
@media(max-width:768px){
  :root{--sidebar-w:0px}
  .sidebar{width:280px;transform:translateX(-280px);transition:transform .25s;z-index:200}
  .sidebar.open{transform:translateX(0)}
  .main,.loading-state{margin-left:0;padding:1.5rem 1.2rem 3rem}
  .sidebar-toggle{display:flex;align-items:center;gap:4px}
  .topbar-search{display:none}
  .section-header h2{font-size:1.4rem}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
  <div class="topbar-logo">
    <div class="logo-icon">⚓</div>
    <div>
      <div class="topbar-title">Livro de Regras</div>
      <div class="topbar-sub">A Utopia — 3DeT Victory</div>
    </div>
  </div>
  <div class="topbar-search">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Buscar no livro…" autocomplete="off">
  </div>
  <a href="index.html" class="topbar-back">← Voltar</a>
</header>

<div class="search-results" id="searchResults"></div>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="sidebar-label">Conteúdo</div></div>
    <div id="sidebarNav"></div>
  </nav>

  <div class="loading-state" id="loadingState">
    <div class="loading-spinner"></div>
    <span>Carregando livro de regras…</span>
  </div>

  <main class="main" id="mainContent" style="display:none"></main>
</div>

<a href="#" class="scroll-top" id="scrollTop">↑</a>

<script>
// ── CONFIGURAÇÃO: caminho base dos arquivos MD e manifest ──────────
const REGRAS_BASE = 'regras/';

// ── PARSER DE CALLOUTS OBSIDIAN ────────────────────────────────────
// Converte: > [!tipo] Título\n> conteúdo
// Em: <div class="callout callout-tipo">...</div>
function processCallouts(html) {
  // O marked transforma > [!info] Título\n> texto em <blockquote><p>[!info] Título\ntexto</p></blockquote>
  // Capturamos isso e convertemos
  return html.replace(/<blockquote>([\s\S]*?)<\/blockquote>/gi, (match, inner) => {
    // Detecta se começa com [!tipo]
    const calloutMatch = inner.match(/^\s*<p>\[!([\w-]+)\][ \t]*([^\n<]*)([\s\S]*?)<\/p>\s*$/i);
    if (!calloutMatch) return match; // não é callout, retorna original

    const type  = calloutMatch[1].toLowerCase();
    const title = calloutMatch[2].trim();
    const body  = calloutMatch[3].trim();

    return `<div class="callout callout-${type}">` +
      (title ? `<div class="callout-title">${title}</div>` : '') +
      (body  ? `<div class="callout-body"><p>${body}</p></div>` : '') +
      `</div>`;
  });
}

// ── WRAPPER DE TABELAS ─────────────────────────────────────────────
function wrapTables(html) {
  return html
    .replace(/<table>/g, '<div class="table-wrap"><table>')
    .replace(/<\/table>/g, '</table></div>');
}

// ── WIKILINKS DE IMAGEM (Obsidian: ![[arquivo.png]]) ──────────────
function resolveWikiImg(filename) {
  // Normaliza para comparação: lowercase + remove acentos + normaliza separadores
  const normalize = s => s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, '-');

  const key = normalize(filename);

  if (key.includes('poder'))   return 'img/fil-poder-transparent.png';
  if (key.includes('evoluca')) return 'img/fil-evolucao-transparent.png';
  if (key.includes('uniao') || key.includes('unio')) return 'img/fil-uniao-transparent.png';

  return `img/${encodeURIComponent(filename)}`;
}

// Process BEFORE marked so we can wrap in a paragraph-safe <p> tag
// But we use a placeholder approach to prevent marked from eating the next line
function processWikiImages(text) {
  return text.replace(/!\[\[([^\]]+\.(png|jpg|jpeg|gif|webp|svg))\]\]/gi, (_, filename) => {
    const src = resolveWikiImg(filename);
    // Wrap in blank lines so marked treats it as a standalone block, not inline
    return `\n\n<div class="wiki-img-wrap"><img src="${src}" alt="${filename}" class="wiki-img" loading="lazy"></div>\n\n`;
  });
}

// ── RENDER MARKDOWN ────────────────────────────────────────────────
function renderMD(text) {
  let processed = processWikiImages(text);
  let html = marked.parse(processed, { gfm: true, breaks: false });
  html = processCallouts(html);
  html = wrapTables(html);
  return html;
}

// ── LOADER PRINCIPAL ───────────────────────────────────────────────
let allSections = [];
let navLinksEls = [];

// Cache-buster: timestamp único por sessão de carregamento
const CB = `?v=${Date.now()}`;

async function init() {
  // 1. Carrega manifest.json (sem cache)
  let manifest;
  try {
    const res = await fetch(REGRAS_BASE + 'manifest.json' + CB, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    manifest = await res.json();
  } catch (e) {
    document.getElementById('loadingState').innerHTML =
      `<span style="color:var(--red);text-align:center">❌ Não foi possível carregar o manifest.<br><code style="font-size:.8rem">${REGRAS_BASE}manifest.json</code><br><br>Verifique se a pasta <code>regras/</code> existe no repositório.</span>`;
    return;
  }

  // 2. Busca todos os .md em paralelo (sem cache)
  const loaded = await Promise.all(
    manifest.map(sec =>
      fetch(REGRAS_BASE + sec.file + CB, { cache: 'no-store' })
        .then(r => r.ok ? r.text() : Promise.reject())
        .then(text => ({ ...sec, text }))
        .catch(() => ({ ...sec, text: `> [!danger] Arquivo não encontrado\n> \`${sec.file}\`` }))
    )
  );
  allSections = loaded;

  // 3. Monta sidebar
  const sidebarNav = document.getElementById('sidebarNav');
  loaded.forEach(sec => {
    const a = document.createElement('a');
    a.className = 'nav-link' + (sec.sub ? ' nav-sub' : '');
    a.dataset.target = sec.id;
    if (sec.sub) { a.style.paddingLeft = '1.5rem'; a.style.fontSize = '.82rem'; }
    a.innerHTML = `<span class="nav-num">${sec.num}</span><span class="nav-emoji">${sec.emoji}</span><span class="nav-name">${sec.titulo}</span>`;
    a.addEventListener('click', () => {
      const el = document.getElementById(sec.id);
      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 72, behavior: 'smooth' });
      if (window.innerWidth < 768) document.getElementById('sidebar').classList.remove('open');
    });
    sidebarNav.appendChild(a);
    navLinksEls.push(a);
  });

  // 4. Monta conteúdo
  const main = document.getElementById('mainContent');
  loaded.forEach(sec => {
    const section = document.createElement('section');
    section.id = sec.id;
    section.className = 'content-section';
    const hClass = sec.sub ? 'section-header sub-header' : 'section-header';
    section.innerHTML =
      `<div class="${hClass}">` +
        `<span class="section-num">${sec.num}</span>` +
        `<span class="section-emoji">${sec.emoji}</span>` +
        `<h2>${sec.titulo}</h2>` +
      `</div>` +
      `<div class="section-body">${renderMD(sec.text)}</div>`;
    main.appendChild(section);
  });

  // 5. Mostra
  document.getElementById('loadingState').style.display = 'none';
  main.style.display = 'block';

  // 6. Intersection observer (nav ativa)
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const id = entry.target.id;
      navLinksEls.forEach(l => l.classList.toggle('active', l.dataset.target === id));
      const active = sidebarNav.querySelector('.nav-link.active');
      if (active) {
        const sb = document.getElementById('sidebar');
        const top = active.offsetTop;
        if (top < sb.scrollTop || top > sb.scrollTop + sb.clientHeight - 80)
          sb.scrollTop = top - sb.clientHeight / 2;
      }
    });
  }, { threshold: 0.1, rootMargin: '-56px 0px -60% 0px' });

  document.querySelectorAll('.content-section').forEach(s => observer.observe(s));

  // 7. Busca
  initSearch(loaded);
}

// ── SEARCH ────────────────────────────────────────────────────────
function initSearch(sections) {
  const inp = document.getElementById('searchInput');
  const res = document.getElementById('searchResults');

  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    if (q.length < 2) { res.style.display = 'none'; return; }

    const hits = sections
      .filter(s => s.titulo.toLowerCase().includes(q) || s.text.toLowerCase().includes(q))
      .slice(0, 8)
      .map(s => {
        let preview = '';
        const idx = s.text.toLowerCase().indexOf(q);
        if (idx >= 0) {
          const start = Math.max(0, idx - 40), end = Math.min(s.text.length, idx + 80);
          preview = '…' + s.text.slice(start, end).replace(/[#*>`\[\]]/g, '') + '…';
        }
        return `<div class="search-result-item" onclick="goTo('${s.id}')">
          <div class="search-result-title">${s.emoji} ${s.titulo}</div>
          <div class="search-result-preview">${preview}</div>
        </div>`;
      });

    res.innerHTML = hits.length
      ? hits.join('')
      : '<div style="padding:1rem 1.5rem;color:var(--text3);font-size:.85rem">Nenhum resultado.</div>';
    res.style.display = 'block';
  });

  document.addEventListener('click', e => {
    if (!res.contains(e.target) && e.target !== inp) res.style.display = 'none';
  });
}

function goTo(id) {
  const el = document.getElementById(id);
  if (el) window.scrollTo({ top: el.getBoundingClientRect().top + scrollY - 72, behavior: 'smooth' });
  document.getElementById('searchResults').style.display = 'none';
  document.getElementById('searchInput').value = '';
}

// ── SIDEBAR TOGGLE ────────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ── SCROLL TOP ────────────────────────────────────────────────────
const scrollTopBtn = document.getElementById('scrollTop');
window.addEventListener('scroll', () => scrollTopBtn.classList.toggle('visible', scrollY > 400));
scrollTopBtn.addEventListener('click', e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });

// ── BOOT ──────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
